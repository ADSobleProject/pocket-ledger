<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>포켓 가계부</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="구글 시트와 연결되는 개인용 모바일 가계부">
<meta name="theme-color" content="#F2F4F7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="포켓 가계부">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css?v=10">
</head>
<body>

<!-- ───────────────────────── 연결 / 잠금 화면 ───────────────────────── -->
<section id="lock" class="lock">
  <div class="lock__hero">
    <div class="lock__inner">
      <img class="lock__logo" src="./icons/icon.svg" alt="" width="64" height="64">
      <h1 class="lock__title">포켓 가계부</h1>
      <p class="lock__sub">내 구글 시트와 이어지는<br>가장 간단한 가계부</p>
    </div>
  </div>

  <div class="lock__body">
    <form id="lockForm" class="lock__card" autocomplete="off">
      <label class="field">
        <span class="field__label">Apps Script 웹 앱 URL</span>
        <input id="inUrl" class="input" type="url" inputmode="url" spellcheck="false"
               placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off">
      </label>

      <label class="field">
        <span class="field__label">PIN (4자리)</span>
        <input id="inPin" class="input input--pin" type="password" inputmode="numeric" pattern="[0-9]*"
               maxlength="4" placeholder="••••" autocomplete="off">
      </label>

      <p id="lockError" class="lock__error" hidden></p>

      <button id="btnConnect" class="btn btn--primary btn--block" type="submit">
        <span class="btn__label">연결하기</span>
      </button>

      <p class="lock__hint">
        URL과 PIN은 <b>이 기기에만</b> 저장됩니다.<br>가계부 데이터는 구글 시트에만 남습니다.
      </p>
    </form>

    <details class="lock__help">
      <summary>처음이신가요? 연결 준비 4단계</summary>
      <ol class="lock__steps">
        <li>구글 시트 → <b>확장 프로그램 → Apps Script</b></li>
        <li><code>Code.gs</code> 전체를 붙여넣고 <code>APP_PIN</code>을 4자리로 수정 후 저장</li>
        <li><b>배포 → 새 배포 → 웹 앱</b><br>
            실행: <b>나</b> · 액세스: <b>모든 사람</b></li>
        <li>나온 <b>웹 앱 URL</b>(…/exec)을 위에 붙여넣기</li>
      </ol>
      <p class="lock__steps-note">백엔드 파일은 저장소의 <code>apps-script/Code.gs</code>에 있습니다.</p>
    </details>
  </div>
</section>

<!-- ───────────────────────── 메인 화면 ───────────────────────── -->
<div id="main" class="app" hidden>
  <header class="topbar" id="topbar">
    <div class="topbar__left">
      <h1 class="topbar__title" id="topTitle">홈</h1>
      <p class="topbar__sub" id="topSub"></p>
    </div>
    <div class="topbar__right">
      <button class="iconbtn" id="btnRefresh" type="button" aria-label="새로고침">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="iconbtn" id="btnSettings" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.04V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.01A1.7 1.7 0 0 0 20.96 10H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="home" type="button">
      <svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>
      <span class="tab__label">홈</span>
    </button>
    <button class="tab" data-tab="list" type="button">
      <svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <span class="tab__label">내역</span>
    </button>
    <button class="tab tab--add" data-tab="add" type="button">
      <span class="tab__plus" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </span>
      <span class="tab__label">입력</span>
    </button>
    <button class="tab" data-tab="plan" type="button">
      <svg class="tab__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      <span class="tab__label">결혼/월별</span>
    </button>
  </nav>
</div>

<!-- 토스트 -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 바텀시트 -->
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet__grip"></div>
  <div id="sheetBody" class="sheet__body"></div>
</section>

<script src="./app.js?v=10"></script>
</body>
</html>
